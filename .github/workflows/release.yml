name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: cf-email_linux_amd64.tar.gz
          - goarch: arm64
            asset: cf-email_linux_arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Embed web assets
        run: |
          rm -rf backend/internal/web/dist
          mkdir -p backend/internal/web/dist
          cp -r web/dist/. backend/internal/web/dist/
          touch backend/internal/web/dist/.gitkeep

      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/cf-email ./cmd/backend

      - name: Package artifact
        run: |
          mkdir -p release
          cp backend/dist/cf-email release/cf-email
          chmod 0755 release/cf-email
          tar -C release -czf ${{ matrix.asset }} cf-email

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          find artifacts -type f -name 'cf-email_linux_*.tar.gz' -exec cp {} . \;
          sha256sum cf-email_linux_*.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cf-email_linux_amd64.tar.gz
            cf-email_linux_arm64.tar.gz
            checksums.txt
